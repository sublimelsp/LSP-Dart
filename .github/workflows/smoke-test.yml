name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The language server is part of the Dart SDK.
      - uses: dart-lang/setup-dart@v1

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Dart syntax that the server is enabled for.
          extra-packages: elMuso/Dartlight
